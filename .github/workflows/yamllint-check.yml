---
name: Yamllint Check

on:
    push:
    pull_request:
        branches: [stable]

permissions:
    contents: read

jobs:
    yamlcheck:
        name: Yamllint Workflows Check
        runs-on: ubuntu-latest

        steps:
            - name: Check out code from GitHub
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Install Yamllint
              run: |
                  python3 -m pip install --upgrade pip
                  pip3 install yamllint

            - name: Perform Yaml Check
              run: |
                  yamllint --format github .github/workflows
