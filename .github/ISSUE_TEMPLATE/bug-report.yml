---
name: Bug Report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
assignees: ["ByteCorum"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting! Please fill out every section below.
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Provide a clear and concise description of what the bug is.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: What did you expect to happen?
          description: Provide a clear and concise description of what you expected to happen.
      validations:
          required: true
    - type: textarea
      id: reproduce
      attributes:
          label: Steps to reproduce
          description: Minimal, numbered steps to reproduce the behavior.
          placeholder: "1. ...\n2. ..."
      validations:
          required: true
    - type: textarea
      id: screenshots
      attributes:
          label: Screenshots or screen recording
          description: If applicable, drag and drop or paste images directly into this field.
      validations:
          required: false
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs and error messages
          description: Paste any error output, stack traces, or log excerpts. Wrap them in a code block (three backticks).
          render: shell
      validations:
          required: false
    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: OS, hardware, version, runtime, relevant configuration.
      validations:
          required: false
    - type: input
      id: version
      attributes:
          label: Affected version
          description: Version confirmation.
          placeholder: "e.g. 1.2.3"
      validations:
          required: true
    - type: checkboxes
      id: checks
      attributes:
          label: Verification
          options:
              - label: I have searched existing issues and found no duplicate.
                required: true
              - label: This reproduces on the latest version.
                required: true
              - label: I've read and agree with the [Code of Conduct](https://github.com/ByteCorum/pyguard/blob/stable/docs/CODE_OF_CONDUCT.md)
                required: true
              - label: It doesn't overlap with existing items in the [Todo List](https://github.com/ByteCorum/pyguard/blob/stable/docs/TODO.md)
                required: true
