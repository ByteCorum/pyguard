name: Windows tests

on:
  push:
    branches: [ stable, WIP ]
  pull_request:
    branches: [ stable, WIP ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable
      working-directory: scr
      run: |
        .\build-win.cmd

    - name: Archive Executable
      uses: actions/upload-artifact@v4
      with:
        name: dotpyguard-win
        path: scr\dotpyguard.exe

  obfuscation-multifile:
    needs: ["build"]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Executable
      uses: actions/download-artifact@v8
      with:
        name: dotpyguard-win
        path: "examples"

    - name: Preparation For Tests
      working-directory: examples
      run: |
        move "dotpyguard.exe" "multifile"
        Remove-Item -Path "multifile\obfuscated" -Recurse -Force

    - name: Obfuscation
      working-directory: examples\multifile
      run: |
        .\dotpyguard.exe obfuscate --aes --hashdata --fernet --chacha --salsa --base64 --recursive 4 --follow-imports --no-input --files lib.py main.py

    - name: Testing
      working-directory: examples\multifile\obfuscated
      run: |
        $OUTPUT = $(python main.py)
        Write-Host "Output: "
        Write-Host $OUTPUT

        Write-Host "Result: "
        if ($OUTPUT -eq "hello world") {
          Write-Host "Success: main.py output contains 'hello world'"
        } else {
          Write-Host "Failure: main.py output does not contain 'hello world'"
          exit 1
        }

  obfuscation-onefile:
