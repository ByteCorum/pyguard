---
name: Close Stale Items

on:
    schedule:
        - cron: "0 0 * * 1" # weekly, Monday midnight UTC

permissions:
    contents: read

jobs:
    stale:
        name: Close Stale Items
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write

        steps:
            - name: Close stale pull requests and issues
              uses: actions/stale@v11
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  days-before-stale: 30
                  days-before-close: 7
                  remove-stale-when-updated: true

                  stale-issue-label: "stale"
                  stale-pr-label: "stale"
                  exempt-all-milestones: true
                  exempt-issue-labels: "no-stale,status: needs-triage,status: in-progress,status: blocked,status: suspended"
                  exempt-pr-labels: "no-stale,status: needs-triage,status: in-progress,status: blocked,status: suspended"

                  stale-issue-message: |
                      There hasn't been any activity on this issue recently, and in order to prioritize active issues, it will be marked as stale.
                      Because this issue is marked as stale, it will be closed and locked in 7 days if no further activity occurs.

                  stale-pr-message: |
                      There hasn't been any activity on this PR recently, and in order to prioritize active PRs, it will be marked as stale.
                      Because this PR is marked as stale, it will be closed and locked in 7 days if no further activity occurs.

                  close-issue-message: "This issue was closed due to inactivity. If the problem persists, please reopen it or open a new issue with updated details."
                  close-pr-message: "This pull request was closed due to inactivity. If you would like to continue this work, please reopen it or open a new PR; your branch remains available."
