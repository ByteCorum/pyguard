---
# Type
- name: "type: bug"
  color: ee0000
  description: "Something isn't working as expected or causes issues"
- name: "type: documentation"
  color: 0000ee
  description: "Improvements or additions to documentation"
- name: "type: enhancement"
  color: 00ee00
  description: "Ideas for improvements or new features"
- name: "type: question"
  color: ee0701
  description: "Usage question belongs in Discussions"
- name: "type: maintenance"
  color: bf9b18
  description: "Maintenance/Refactor/Performance work that neither adds features nor fixes bugs"
- name: "type: other"
  color: afafaf
  description: "Change not covered by any existing type"

# Status
- name: "status: done"
  color: 0cbf00
  description: "Already completed and awaits future actions"
- name: "status: needs-triage"
  color: e99695
  description: "Awaiting maintainer review"
- name: "status: in-progress"
  color: fbca04
  description: "Actively being worked on"
- name: "status: blocked"
  color: b60205
  description: "Blocked by an external dependency"
- name: "status: needs-info"
  color: 5319e7
  description: "Waiting for additional information from the reporter"
- name: "status: suspended"
  color: fef2c0
  description: "Work has been suspended or put on hold"

# Priority
- name: "priority: 0"
  color: ee0000
  description: "Highest priority issue that should be worked on immediately"
- name: "priority: 1"
  color: b60205
  description: "High priority issue that should be addressed urgently"
- name: "priority: 2"
  color: fbca04
  description: "Medium priority issue for normal workflow."
- name: "priority: 3"
  color: 0d5e89
  description: "Low priority issue that can be addressed when time permits."

# Size
- name: "size: S"
  color: c5def5
  description: "Small: Under an hour, trivial change; small project impact"
- name: "size: M"
  color: 81d4fa
  description: "Medium: a few hours to a day; medium project impact"
- name: "size: L"
  color: 4fc3f7
  description: "Large: multiple days, significant rework; large project impact"
- name: "size: XL"
  color: 0288d1
  description: "Extra large: should be split before starting; massive project impact"

# Additional
- name: "invalid"
  color: ffffff
  description: "Does not seem right"
- name: "security"
  color: b60205
  description: "Security-related change or report"
- name: "revert"
  color: b60205
  description: "Revert of a previous PR"
- name: "ai-marked"
  color: b60205
  description: "AI-generated contribution"
- name: "breaking-change"
  color: b60205
  description: "Introduces a breaking change; requires MAJOR version bump"
- name: "duplicate"
  color: cccccc
  description: "This issue or pull request already exists"
- name: "wontfix"
  color: ffffff
  description: "This will not be worked on or fixed"
- name: stale
  color: cccccc
  description: No activity for an extended period; will be closed soon unless updated
- name: "no-stale"
  color: 56d364
  description: Exempt from stale automation; this item must not be auto-closed
