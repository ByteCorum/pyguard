---
name: Documentation Issue
description: Report errors, gaps, or unclear parts of the documentation.
title: "[Docs]: "
labels: ["type: documentation", "status: needs-triage"]
assignees: ["ByteCorum"]
body:
    - type: input
      id: location
      attributes:
          label: Where in the docs?
          description: Provide a concrete location in the docs where it's located.
      validations:
          required: true
    - type: textarea
      id: issue
      attributes:
          label: What is wrong or missing?
          description: Provide a link or file path to the affected documentation.
      validations:
          required: true
    - type: textarea
      id: improvement
      attributes:
          label: Suggested improvement
          description: Provide a clear and concise description of what specific change you would like.
      validations:
          required: false
    - type: checkboxes
      id: checks
      attributes:
          label: Verification
          options:
              - label: I have searched existing issues and found no duplicate.
                required: true
              - label: I've read and agree with the [Code of Conduct](https://github.com/ByteCorum/pyguard/blob/stable/docs/CODE_OF_CONDUCT.md)
                required: true
